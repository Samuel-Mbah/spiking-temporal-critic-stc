# POPSan baseline: population-coded SNN actor + ANN critic
# Matches snn_actor_snn_timing_critic.yaml exactly (partial obs + frame stack)
# so results are directly comparable.
#
# Reference: Tang et al. (2021) "Deep Reinforcement Learning with
# Population-Coded Spiking Neural Network for Continuous Control".
#
# Key difference from snn_actor_ann_critic:
#   Each of the 8 obs values is encoded into 10 Gaussian neurons →
#   the SNN actor receives an 80-dim spike-rate vector instead of raw obs.

run_name: "POPSan_POC_NeurIPS"
project_name: "poc-snn-neurips"
log_dir: "results/NeurIPS/logs/poc/popsan"
plots_dir: "results/NeurIPS/plots/poc/popsan"
video_dir: "results/NeurIPS/videos/poc/popsan"
wandb_dir: "results/NeurIPS/wandb/poc/popsan"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 5
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "CartPole-v1"
  n_envs: 8
  vec_normalize: false
  max_episode_steps: 500
  partial_obs:
    indices: [0, 2]       # position + angle (matches timing critic config)
  frame_stack: 4
  frame_stack_flatten: true

logging:
  checkpoint_interval_updates: 100
  save_last_checkpoint: true
  logger_collect_spikes: true
  activations_probe_interval: 100
  latency_probe_interval: 100

training:
  shuffle_minibatches: false
  rollout_length: 2048
  total_updates: 500
  batch_size: 256
  update_epochs: 10
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.001
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  clip_range_vf: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.015
  print_interval_updates: 20
  eval_interval_updates: 20
  eval_episodes: 20
  solved_window_eval_episodes: 100
  eval_seed: 42
  reward_threshold: 475.0
  success_rate_threshold: 95.0
  scale_returns_to_value: false

model:
  mode: "popsan"
  hidden_dim: 64
  dropout: 0.0
  in_features: 8        # raw obs dim (2 partial * 4 frame stack); encoder expands this
  critic_informs_actor: false

snn:
  T: null
  beta: 0.95
  V_th: 1.0
  poisson_encode: false  # population encoding replaces Poisson
  rate_scale: 1.0

  actor_T: 16
  actor_V_th: 0.6
  actor_surrogate_type: "fast_sigmoid"
  actor_surrogate_slope: 5.0
  actor_logit_temp: 1.0
  actor_poisson_encode: false
  center_logits: true

  # POPSan population encoder parameters.
  # obs_low/obs_high should cover the typical range of *each* observation
  # dimension after partial obs + frame stack.  CartPole partial obs gives
  # position (~[-2.4, 2.4]) and angle (~[-0.21, 0.21]).  Using [-5, 5]
  # covers both with slack; tighten or use per-dim bounds if needed.
  popsan_n_neurons: 10      # neurons per observation dimension → 8*10=80 SNN inputs
  popsan_obs_low: -5.0
  popsan_obs_high: 5.0
  popsan_sigma_scale: 1.0   # σ = sigma_scale * spacing_between_means

benchmark:
  measure_inference_energy: true
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50

sticky_action:
  train: false
  eval: true

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

reporting:
  save_plots: true
  wandb:
    use: false
    project: "cartpole-snn-project"
    tags: ["research", "snn", "popsan", "population-coding"]
