# Ablation: SNN Actor + Rate-coded SNN Critic — Partially Observable CartPole
# Reviewer ablation variant — isolates the contribution of latency coding and
# distinct surrogate gradients in STC. All hyperparameters match the POC STC
# config exactly except: timing critic → rate-coded critic, cosh → fast_sigmoid.

run_name: "SNN_RateCodedCritic_POC_NeurIPS"
project_name: "poc-snn-neurips"
log_dir: "results/NeurIPS/logs/poc/snn_rate_critic"
plots_dir: "results/NeurIPS/plots/poc/snn_rate_critic"
video_dir: "results/NeurIPS/videos/poc/snn_rate_critic"
wandb_dir: "results/NeurIPS/wandb/poc/snn_rate_critic"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 5
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "CartPole-v1"
  n_envs: 8
  vec_normalize: false
  max_episode_steps: 500
  partial_obs:
    indices: [0, 2] # position + angle only (hide velocity terms)
  frame_stack: 4
  frame_stack_flatten: true

logging:
  checkpoint_interval_updates: 100
  save_last_checkpoint: true
  logger_collect_spikes: true
  activations_probe_interval: 100
  latency_probe_interval: 100

training:
  shuffle_minibatches: false
  rollout_length: 2048
  total_updates: 500
  batch_size: 256
  update_epochs: 10
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.0003
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.1
  clip_range_vf: null
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  print_interval_updates: 20
  eval_interval_updates: 20
  eval_episodes: 20
  solved_window_eval_episodes: 100
  eval_seed: 42
  reward_threshold: 475.0
  success_rate_threshold: 95.0
  scale_returns_to_value: false

model:
  mode: "snn_actor_snn_critic"
  hidden_dim: 64
  dropout: 0.2
  in_features: 8 # 2 (partial obs: position + angle) * 4 (frame stack)
  critic_informs_actor: false
  actor_critic_normalize: true

snn:
  T: null
  beta: 0.95
  V_th: 1.0
  poisson_encode: false
  rate_scale: 1.0

  # Actor — identical to POC STC config
  actor_T: 16
  actor_V_th: 0.6
  actor_surrogate_type: "fast_sigmoid"
  actor_surrogate_slope: 5.0
  actor_logit_temp: 1.0
  actor_poisson_encode: false
  center_logits: true

  # Critic — rate coding, same surrogate as actor
  critic_T: 32
  critic_V_th: 0.5
  critic_rate_scale: 5.0
  critic_poisson_encode: false
  critic_surrogate_type: "fast_sigmoid"
  critic_surrogate_slope: 5.0

benchmark:
  measure_inference_energy: true
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50

spike_reg:
  lambda_spike: 0.0002

sticky_action:
  train: false
  eval: true

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

reporting:
  save_plots: true
  wandb:
    use: false
    project: "cartpole-snn-project"
    tags: ["research", "snn", "rate-critic", "poc", "ablation"]
