# Research-grade SNN Actor + ANN Critic (Direct Training) for partially observable CartPole
# - Baseline Comparison: Isolates actor performance under partial observability

run_name: "SNN_ANN_Critic_POC_NeurIPS"
project_name: "poc-snn-neurips"
log_dir: "results/NeurIPS/logs/poc/snn_ann_critic"
plots_dir: "results/NeurIPS/plots/poc/snn_ann_critic"
video_dir: "results/NeurIPS/videos/poc/snn_ann_critic"
wandb_dir: "results/NeurIPS/wandb/poc/snn_ann_critic"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 5
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "CartPole-v1"
  n_envs: 8
  vec_normalize: false
  max_episode_steps: 500
  partial_obs:
    indices: [0, 2] # position + angle only (hide velocity terms)
  frame_stack: 4 # stack frames to compensate partial observability
  frame_stack_flatten: true # flatten stacked frames for MLP input

logging:
  checkpoint_interval_updates: 100
  save_last_checkpoint: true
  logger_collect_spikes: true
  activations_probe_interval: 100
  latency_probe_interval: 100

# TRAINING (POC + frame stack)
training:
  rollout_length: 2048 # Large buffer for stable gradients
  total_updates: 500 # 500 updates * 16,384 steps = ~8.19M total steps
  batch_size: 256
  update_epochs: 10
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.001
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  clip_range_vf: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.015
  eval_interval_updates: 20
  eval_episodes: 20
  solved_window_eval_episodes: 100
  eval_seed: 42
  print_interval_updates: 20
  reward_threshold: 475.0
  success_rate_threshold: 95.0
  scale_returns_to_value: false

model:
  mode: "snn_actor_ann_critic"
  hidden_dim: 64
  dropout: 0.0
  in_features: 8 # 2 obs dims * 4 frame stack
  critic_informs_actor: false

snn:
  T: 16
  beta: 0.95
  V_th: 0.6
  poisson_encode: false
  rate_scale: 1.0
  actor_surrogate_type: "fast_sigmoid"
  actor_surrogate_slope: 5.0
  actor_logit_temp: 1.0
  center_logits: true

sticky_action:
  train: false
  eval: true

benchmark:
  measure_inference_energy: true
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

reporting:
  save_plots: true
  wandb:
    use: false
    project: "cartpole-snn-project"
    tags: ["research", "snn", "actor-only", "poc"]
