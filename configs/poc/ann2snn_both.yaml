# Research-grade ANN -> SNN (Full Conversion) for partially observable CartPole
# Phase 1: ANN training with partial obs + frame stack
# Phase 2: Conversion & Fine-tuning

run_name: "ANN2SNN_Full_POC_NeurIPS"
project_name: "poc-snn-neurips"
log_dir: "results/NeurIPS/logs/poc/ann2snn_both"
plots_dir: "results/NeurIPS/plots/poc/ann2snn_both"
video_dir: "results/NeurIPS/videos/poc/ann2snn_both"
wandb_dir: "results/NeurIPS/wandb/poc/ann2snn_both"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 5
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "CartPole-v1"
  n_envs: 8
  vec_normalize: false
  max_episode_steps: 500
  partial_obs:
    indices: [0, 2] # position + angle only (hide velocity terms)
  frame_stack: 4 # stack frames to compensate partial observability
  frame_stack_flatten: true # flatten stacked frames for MLP input

logging:
  checkpoint_interval_updates: 100
  save_last_checkpoint: true
  activations_probe_interval: 100
  latency_probe_interval: 100

# PHASE 1: ANN TRAINING (POC + frame stack)
training:
  rollout_length: 2048 # Large buffer for stable gradients
  total_updates: 500 # 500 updates * 16,384 steps = ~8.19M total steps
  batch_size: 256
  update_epochs: 10
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.001
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  clip_range_vf: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.015
  eval_interval_updates: 20
  eval_episodes: 20
  solved_window_eval_episodes: 100
  eval_seed: 42
  print_interval_updates: 20
  reward_threshold: 475.0
  success_rate_threshold: 95.0
  scale_returns_to_value: false

model:
  mode: "ann2snn_both"
  hidden_dim: 64
  dropout: 0.0
  critic_informs_actor: false
  in_features: 16 # 4 (obs size) * 4 (frame stack)

# PHASE 2: CONVERSION
snn_convert:
  convert_actor: true
  convert_critic: true
  T: 32
  beta: 1.0
  V_th: 1.0
  poisson_encode: false
  rate_scale: 1.0
  center_logits: true

# PHASE 3: FINE-TUNING
snn_finetune:
  enabled: false
  total_updates: 50 # Extra stabilization after conversion
  lr: 0.0001
  lambda_spike: 0.001

benchmark:
  measure_inference_energy: true
  energy_runs_per_measure: 5
  run_for_ann: true
  num_episodes_for_benchmark: 50

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

sticky_action:
  train: false
  eval: false

reporting:
  save_plots: true
  wandb:
    use: false
    project: "cartpole-snn-project"
    tags: ["research", "ann2snn", "full"]
