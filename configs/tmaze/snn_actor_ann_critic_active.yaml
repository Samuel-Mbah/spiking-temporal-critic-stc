# SNN Actor + ANN Critic for T-Maze (Active, Length 3)
# Active variant: hint appears during traversal (harder than passive).
# Key differences from passive config:
#   - total_updates: 400 (2x — active task needs more training)
#   - lr: 0.0001 (3x lower — prevents critic from locking in bad values early)
#   - rollout_length: 128 (2x — better advantage estimates, especially under sparse reward)
#   - value_coef: 0.25 (halved — critic with bad init can't dominate policy updates)
#   - entropy_coef: 0.1 (higher — keeps exploration alive in seeds that start slowly)
#   - max_grad_norm: 0.3 (tighter — prevents large gradient steps from bad critic)
#   - clip_range_vf: 0.2 (prevents critic value collapse)
#   - normalize_value_targets: true (stabilises critic on sparse rewards)
#   - critic_value_init_bias: 0.1 (breaks zero-value fixed point — orthogonal init zeros
#     all biases; on sparse-reward active task critic trivially converges to 0 and never
#     escapes, causing actor gradient collapse within 10 updates)

run_name: "SNN_ANN_Critic_TMaze_Active_NeurIPS"
project_name: "tmaze-snn-neurips"
log_dir: "results/logs/neurips/tmaze_active/snn_ann_critic"
plots_dir: "results/plots/neurips/tmaze_active/snn_ann_critic"
video_dir: "results/videos/neurips/tmaze_active/snn_ann_critic"
wandb_dir: "results/wandb/neurips/tmaze_active/snn_ann_critic"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 5
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "tmaze-v0"
  kwargs:
    active: true
    length: 3
  n_envs: 8
  vec_normalize: false
  max_episode_steps: 100
  frame_stack: 4
  frame_stack_flatten: true

logging:
  checkpoint_interval_updates: 10
  save_last_checkpoint: true
  logger_collect_spikes: true
  activations_probe_interval: 100
  latency_probe_interval: 100

training:
  rollout_length: 128             # 2x — better advantage estimates under sparse reward
  total_updates: 400              # 2x passive — active task requires more training
  batch_size: 64
  update_epochs: 4
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.0001                      # 3x lower — prevents critic from locking in bad values early
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  clip_range_vf: 0.2              # Prevents critic value collapse (key fix)
  entropy_coef: 0.1               # Higher — keeps exploration alive in slow-starting seeds
  value_coef: 0.25                # Halved — bad critic init can't dominate policy updates
  max_grad_norm: 0.3              # Tighter — prevents large gradient steps from bad critic
  target_kl: 0.015
  kl_coef: 0.02
  print_interval_updates: 10
  eval_interval_updates: 10
  eval_episodes: 20
  solved_window_eval_episodes: 100
  eval_seed: 42
  reward_threshold: 0.95
  success_rate_threshold: 95.0
  scale_returns_to_value: false
  normalize_value_targets: true   # Stabilises critic on sparse active-task rewards

model:
  mode: "snn_actor_ann_critic"
  hidden_dim: 128
  dropout: 0.2
  in_features: 16                 # 4 (obs size) * 4 (frame stack)
  critic_informs_actor: false
  critic_value_init_bias: 0.1     # Break zero-value fixed point on sparse-reward active task

snn:
  T: 16
  beta: 0.95
  V_th: 0.6
  poisson_encode: false
  rate_scale: 1.0
  actor_surrogate_type: "fast_sigmoid"
  actor_surrogate_slope: 5.0
  actor_logit_temp: 1.0
  center_logits: true

spike_reg:
  lambda_spike: 0.001

sticky_action:
  train: false
  eval: true

benchmark:
  measure_inference_energy: false
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

post_eval:
  n_eval_steps: 512
  n_eval_episodes: null
  deterministic: true
  max_episode_steps: 100

reporting:
  save_plots: true
  wandb:
    use: false
    project: "tmaze-snn-neurips"
    tags: ["research", "snn", "actor-only", "active"]
