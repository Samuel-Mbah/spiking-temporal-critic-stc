# Ablation: SNN Actor + Rate-coded SNN Critic — T-Maze Active
# Reviewer ablation variant — isolates the contribution of latency coding and
# distinct surrogate gradients in STC. All hyperparameters match the active
# STC config except: timing critic → rate-coded critic, cosh → fast_sigmoid.

run_name: "SNN_RateCodedCritic_TMaze_Active_NeurIPS"
project_name: "tmaze-snn-neurips"
log_dir: "results/logs/neurips/tmaze_active/snn_rate_critic"
plots_dir: "results/plots/neurips/tmaze_active/snn_rate_critic"
video_dir: "results/videos/neurips/tmaze_active/snn_rate_critic"
wandb_dir: "results/wandb/neurips/tmaze_active/snn_rate_critic"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 5
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "tmaze-v0"
  kwargs:
    active: true
    length: 3
  n_envs: 8
  vec_normalize: false
  max_episode_steps: 100
  frame_stack: 4
  frame_stack_flatten: true

logging:
  checkpoint_interval_updates: 10
  save_last_checkpoint: true
  logger_collect_spikes: true
  activations_probe_interval: 100
  latency_probe_interval: 100

training:
  rollout_length: 64
  total_updates: 400 # Match active STC — harder task needs more budget
  batch_size: 64
  update_epochs: 4
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.0003
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  clip_range_vf: 0.2
  entropy_coef: 0.08 # Higher to sustain exploration on harder task
  value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.015
  kl_coef: 0.02
  print_interval_updates: 10
  eval_interval_updates: 10
  eval_episodes: 20
  solved_window_eval_episodes: 100
  eval_seed: 42
  reward_threshold: 0.95
  success_rate_threshold: 95.0
  scale_returns_to_value: false
  normalize_value_targets: false

model:
  mode: "snn_actor_snn_critic"
  hidden_dim: 128
  dropout: 0.2
  in_features: 16 # 4 (obs size) * 4 (frame stack)
  critic_informs_actor: false
  actor_critic_normalize: true

snn:
  T: null
  beta: 0.95
  V_th: 1.0
  poisson_encode: false
  rate_scale: 1.0

  # Actor — identical to STC active config
  actor_T: 16
  actor_V_th: 0.6
  actor_surrogate_type: "fast_sigmoid"
  actor_surrogate_slope: 5.0
  actor_logit_temp: 1.0
  actor_poisson_encode: false
  center_logits: true

  # Critic — rate coding, same surrogate as actor
  critic_T: 32
  critic_V_th: 1.0
  critic_rate_scale: 5.0
  critic_poisson_encode: false
  critic_surrogate_type: "fast_sigmoid"
  critic_surrogate_slope: 5.0

benchmark:
  measure_inference_energy: true
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50

spike_reg:
  lambda_spike: 0.0005 # Match active STC

sticky_action:
  train: false
  eval: true

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

post_eval:
  n_eval_steps: 512
  n_eval_episodes: null
  deterministic: true
  max_episode_steps: 100

reporting:
  save_plots: true
  wandb:
    use: false
    project: "tmaze-snn-neurips"
    tags: ["research", "snn", "rate-critic", "active", "ablation"]
