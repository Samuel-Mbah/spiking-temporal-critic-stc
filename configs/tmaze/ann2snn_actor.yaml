# Research-grade ANN -> SNN (Actor-Only Conversion) for T-Maze

run_name: "ANN2SNN_Actor_TMaze_v1"
project_name: "tmaze-snn-project"
log_dir: "results/logs/tmaze_ann2snn_actor"
plots_dir: "results/plots/tmaze_ann2snn_actor"
video_dir: "results/videos/tmaze_ann2snn_actor"
wandb_dir: "results/wandb/tmaze_ann2snn_actor"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 1                   # Defer to shell script
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "tmaze-v0"
  kwargs: 
    active: false              # Start with inactive T-Maze for simplicity
    length: 3
  n_envs: 8
  vec_normalize: false         # False for discrete grid inputs
  max_episode_steps: 100
  frame_stack: 4               # stack frames to compensate for partial observability
  frame_stack_flatten: true    # flatten stacked frames for MLP input

logging:
  checkpoint_interval_updates: 10
  save_last_checkpoint: true
  logger_collect_spikes: true
  activations_probe_interval: 100
  latency_probe_interval: 100

# PHASE 1: ANN TRAINING (Optimized to prevent overkill on simple T-Maze)
training:
  rollout_length: 64           # Reduced from 2048. T-Maze episodes are very short (3-6 steps).
  total_updates: 100           # Reduced from 150. 100 is plenty to solve it.
  batch_size: 64               # Reduced from 256
  update_epochs: 4             # Reduced from 10 to prevent overfitting
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.001
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  clip_range_vf: 0.2
  entropy_coef: 0.05           # 0.05 encourages exploration, 0.0 is too greedy for T-Maze early on
  value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.015
  eval_interval_updates: 10    # Evaluate more frequently due to shorter run
  eval_episodes: 20
  solved_window_eval_episodes: 100
  reward_threshold: 0.95       # Adjusted for T-Maze's max reward of +1
  success_rate_threshold: 95.0
  scale_returns_to_value: false
  print_interval_updates: 10
  print_debug: false

model:
  mode: "ann"
  hidden_dim: 128
  dropout: 0.2
  critic_informs_actor: false
  in_features: 16              # CRITICAL: 4 (obs size) * 4 (frame stack) = 16

# PHASE 2: CONVERSION
snn_convert:
  convert_actor: true
  convert_critic: false
  T: 32                        # 32 steps provides excellent conversion fidelity
  beta: 1.0                    # Beta 1.0 is standard for ANN->SNN rate encoding mathematical equivalence
  V_th: 1.0
  poisson_encode: false
  rate_scale: 1.0
  center_logits: true
  p99_scale: true
  calibration_episodes: 256
  calibration_stochastic: true
  calibration_obs_noise_std: 0.01
  calibration_max_steps_per_episode: 0

# PHASE 3: FINE-TUNING
snn_finetune:
  enabled: true
  total_updates: 50            # Reduced from 100. Fine-tuning a pre-trained T-maze policy is very fast.
  lr: 0.0001
  lambda_spike: 0.001

sticky_action:
  train: false
  eval: true

benchmark:
  measure_inference_energy: false
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false


reporting:
  save_plots: true
  wandb:
    use: false
    project: "tmaze-snn-project"
    tags: ["research", "ann2snn", "actor"]

video:
  record_ann_solution_video: false
  record_zero_shot_video: false
  record_finetune_solution_video: false

post_eval:
  n_eval_steps: 512
  n_eval_episodes: null
  deterministic: true
  max_episode_steps: 100

comparison:
  # Optional: conventional ANN baseline checkpoint for 3-way comparison.
  # If null or missing, only converted ANN vs converted SNN is logged.
  conventional_ann_checkpoint: null
