# Research-grade SNN Actor + ANN Critic for T-Maze (Passive, Length 3)
run_name: "SNN_Actor_ANN_Critic_TMaze_v1"
project_name: "cartpole-snn-project"
log_dir: "results/logs/tmaze_snn_actor_ann_critic"
plots_dir: "results/plots/tmaze_snn_actor_ann_critic"
video_dir: "results/videos/tmaze_snn_actor_ann_critic"
wandb_dir: "results/wandb/tmaze_snn_actor_ann_critic"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 1                   
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "tmaze-v0"
  kwargs: 
    active: false # Passive T-Maze default; override to true for active runs
    length: 3
  n_envs: 8
  vec_normalize: false         # False for direct discrete grid inputs
  max_episode_steps: 100
  # Removed partial_obs: T-Maze naturally outputs a 1D vector (4,), no masking needed.
  frame_stack: 4               # Stack frames to compensate for partial observability
  frame_stack_flatten: true    # Flatten stacked frames for MLP/SNN input

logging:
  checkpoint_interval_updates: 10  # Checkpoint more often since total updates are lower
  save_last_checkpoint: true
  activations_probe_interval: 100
  latency_probe_interval: 100

# TRAINING (Optimized to prevent overkill on simple T-Maze)
training:
  rollout_length: 64           # Reduced from 2048. T-Maze episodes are very short.
  total_updates: 100           # Reduced from 150.
  batch_size: 64               # Reduced from 256
  update_epochs: 4             # Reduced from 10 to prevent overfitting
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.0005                   # Lower policy LR for stability
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.08               # Tighter PPO clipping
  clip_range_vf: 0.1
  entropy_coef: 0.05           # Enough to encourage exploration in T-Maze
  value_coef: 0.5 
  max_grad_norm: 0.5
  target_kl: 0.015  
  kl_coef: 0.02
  print_interval_updates: 10
  eval_interval_updates: 10    # Evaluate more frequently
  eval_episodes: 20           
  solved_window_eval_episodes: 100
  reward_threshold: 0.95       # Adjusted for T-Maze's max reward of +1
  success_rate_threshold: 95.0
  scale_returns_to_value: false
  normalize_value_targets: true

model:
  mode: "snn_actor_ann_critic"
  hidden_dim: 64
  dropout: 0.0
  in_features: 16              # CRITICAL: 4 (obs size) * 4 (frame stack) = 16
  critic_informs_actor: false

# SNN CONFIGURATION
snn:
  T: 16                        # Bumped to 16 to match the actor_T of your successful run
  beta: 0.95
  V_th: 0.6                    # Bumped down to 0.6 to match actor_V_th of successful run
  poisson_encode: false
  rate_scale: 1.0
  actor_surrogate_slope: 5.0   # Matches successful run
  actor_logit_temp: 1.0
  center_logits: true

spike_reg:
  lambda_spike: 0.001          # Copied from your recent update

sticky_action:
  train: false
  eval: true

benchmark:
  measure_inference_energy: false
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50 # 5000  # Massive increase to ensure accurate GPU power sensing

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

post_eval:
  n_eval_steps: 512
  n_eval_episodes: null
  deterministic: true
  max_episode_steps: 100

reporting:
  save_plots: true
  wandb:
    use: false
    project: "T_maze-snn-project"
    tags: ["research", "snn", "actor-only", "poc"]
