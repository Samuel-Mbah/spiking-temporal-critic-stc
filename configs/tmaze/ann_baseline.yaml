run_name: "ANN_TMaze_v0"
project_name: "tmaze-snn-project"
log_dir: "results/logs/tmaze_ann"
plots_dir: "results/plots/tmaze_ann"
video_dir: "results/videos/tmaze_ann"
wandb_dir: "results/wandb/tmaze_ann"

save_ckpt: true
device: "cuda"         # or "cpu"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 5
  base_seed: 42
  per_repeat_tag: "tmaze"

env:
  id: "tmaze-v0"       
  kwargs: 
    active: false # Passive T-Maze default; override to true for active runs
    length: 3
  n_envs: 8
  vec_normalize: false # Usually false for discrete gridworlds with sparse rewards
  max_episode_steps: 100 # Short horizon for T-Maze
  frame_stack: 4      # Helpful for memory in T-Maze
  frame_stack_flatten: true

logging:
  checkpoint_interval_updates: 5
  save_last_checkpoint: true
  logger_collect_spikes: false
  activations_probe_interval: 100
  latency_probe_interval: 100

training:
  shuffle_minibatches: false
  rollout_length: 64  # Shorter rollouts for gridworld
  total_updates: 200  # I want to allow 1M steps (1000 updates * 512 steps)
  batch_size: 64
  update_epochs: 4
  sticky_action: false

ppo:
  lr: 0.001
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  entropy_coef: 0.05
  value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.015
  print_interval_updates: 5
  eval_interval_updates: 10
  eval_episodes: 20
  reward_threshold: 0.95
  success_rate_threshold: 95.0
  solved_window_eval_episodes: 100
  eval_seed: 42
  scale_returns_to_value: false

# Post-training/post-conversion validation trace collection budget + protocol.
# Used by surrogate/conversion validation-data collection.
post_eval:
  n_eval_steps: 512        # Standardized across T-Maze experiments
  n_eval_episodes: null    # Set to integer to cap by episodes
  deterministic: true      # true=argmax policy, false=sample policy
  max_episode_steps: 100   # Align with T-Maze max episode steps

model:
  mode: "ann"  # "ann", "ann_recurrent", "snn_actor_ann_critic", "snn_actor_snn_critic"
  hidden_dim: 128
  dropout: 0.2
  in_features: 16      # 4 (obs size) * 4 (frame stack)

benchmark:
  run_for_ann: false
  num_episodes_for_benchmark: 20

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

reporting:
  save_plots: true
  wandb:
    use: false
