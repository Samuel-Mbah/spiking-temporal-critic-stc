# Research-grade SNN Actor + SNN Timing Critic for FetchReach
run_name: "SNN_TimingCritic_FetchReach_v1"
project_name: "cartpole-snn-project"
log_dir: "results/logs/fetchreach_snn_timing_critic"
plots_dir: "results/plots/fetchreach_snn_timing_critic"
video_dir: "results/videos/fetchreach_snn_timing_critic"
wandb_dir: "results/wandb/fetchreach_snn_timing_critic"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 1                   
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "FetchReachDense-v4"
  kwargs: {}                   # Removed T-Maze specific kwargs
  n_envs: 8
  vec_normalize: true          # CRITICAL: Set to true for continuous robotics states
  max_episode_steps: 50        # FetchReach default is 50 steps
  frame_stack: 1               # Fully observable Markovian state, no memory needed
  frame_stack_flatten: true    # Flatten dict observations for MLP/SNN input

logging:
  checkpoint_interval_updates: 10  
  save_last_checkpoint: true
  activations_probe_interval: 100
  latency_probe_interval: 100

# TRAINING
training:
  rollout_length: 2048        # Increased: Standard for continuous control
  total_updates: 500          # Increased: More updates needed to solve a robotic arm
  batch_size: 256             # Increased for stability
  update_epochs: 10           # Standard for PPO in continuous control
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.0003                  
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2              
  clip_range_vf: null         
  entropy_coef: 0.0           # Set to 0.0 for continuous action spaces
  value_coef: 0.5             
  max_grad_norm: 0.5
  target_kl: 0.015            
  kl_coef: 0.02               
  print_interval_updates: 10
  eval_interval_updates: 10   
  eval_episodes: 20           
  solved_window_eval_episodes: 100
  reward_threshold: -1.5      # Dense FetchReach reward is negative distance. -1.5 is solved
  success_rate_threshold: 95.0
  scale_returns_to_value: false
  normalize_value_targets: false

model:
  mode: "snn_actor_snn_timing_critic"
  hidden_dim: 128
  dropout: 0.2
  in_features: 16              # 16 (flattened obs) * 1 (frame stack) = 16
  critic_informs_actor: false
  actor_critic_normalize: true

# SNN CONFIGURATION
snn:
  T: null
  beta: 0.95
  V_th: 1.0
  poisson_encode: false
  rate_scale: 1.0

  # Actor
  actor_T: 16
  actor_V_th: 0.6 
  actor_surrogate_slope: 5.0
  actor_logit_temp: 1.0
  actor_poisson_encode: false
  center_logits: true

  # Critic
  critic_T: 32
  critic_V_th: 1.0 
  critic_rate_scale: 5.0
  critic_spike_temp: 5.0 
  critic_poisson_encode: false

  # surrogate gradient parameters for critic timing
  critic_cosh_alpha: 2.0  
  critic_cosh_beta: 1.0
  critic_use_hard_no_spike: false

  # Reward Mapping (Temporal Value Encoding) - CRITICAL FIX FOR FETCHREACH
  Rmax: 0.0           # Max dense reward is 0 (when perfectly on target)
  Rmin: -50.0         # Approximate min reward (worst-case distance over 50 steps)


# BENCHMARKING
benchmark:
  measure_inference_energy: false  
  energy_runs_per_measure: 5      
  run_for_ann: false              
  num_episodes_for_benchmark: 50 

spike_reg:
  lambda_spike: 0.001

sticky_action:
  train: false
  eval: true

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

post_eval:
  n_eval_steps: 512
  n_eval_episodes: null
  deterministic: true
  max_episode_steps: 50       # Align with FetchReach max episode steps

reporting:
  save_plots: true
  timing_critic_plot_scope: all_steps
  timing_critic_plot_actor_steps: 16
  wandb:
    use: false
    project: "fetchreach-snn-project"
    tags: ["research", "snn", "timing-critic",]