# POPSan baseline: population-coded SNN actor + ANN critic — FetchReachDense-v4
# Hyperparams match configs/FetchReachDense-v4/snn_actor_ann_critic.yaml exactly.
# Population encoder: 16 obs dims * 10 neurons = 160-dim SNN input.
# vec_normalize: true normalises obs to ~N(0,1); bounds [-4, 4] cover ~4σ.

run_name: "POPSan_FetchReach_v1"
project_name: "fetchreach-snn-project"
log_dir: "results/logs/fetchreach_popsan"
plots_dir: "results/plots/fetchreach_popsan"
video_dir: "results/videos/fetchreach_popsan"
wandb_dir: "results/wandb/fetchreach_popsan"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 5
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "FetchReachDense-v4"
  kwargs: {}
  n_envs: 8
  vec_normalize: true           # CRITICAL: normalises continuous robotics states
  max_episode_steps: 50
  frame_stack: 1
  frame_stack_flatten: true

logging:
  checkpoint_interval_updates: 10
  save_last_checkpoint: true
  logger_collect_spikes: true
  activations_probe_interval: 100
  latency_probe_interval: 100

training:
  rollout_length: 2048
  total_updates: 500
  batch_size: 256
  update_epochs: 10
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.0005
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.08
  clip_range_vf: 0.1
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.015
  kl_coef: 0.02
  print_interval_updates: 10
  eval_interval_updates: 10
  eval_episodes: 20
  solved_window_eval_episodes: 100
  eval_seed: 42
  reward_threshold: -1.5
  success_rate_threshold: 95.0
  scale_returns_to_value: false
  normalize_value_targets: true

model:
  mode: "popsan"
  hidden_dim: 64
  dropout: 0.0
  in_features: 16               # 16-dim flattened obs; encoder expands to 16 * 10 = 160
  critic_informs_actor: false

snn:
  T: 16
  beta: 0.95
  V_th: 0.6
  poisson_encode: false
  rate_scale: 1.0
  actor_surrogate_type: "fast_sigmoid"
  actor_surrogate_slope: 5.0
  actor_logit_temp: 1.0
  center_logits: true

  # With vec_normalize=true obs are ~N(0,1); ±4 covers 4σ safely.
  popsan_n_neurons: 10          # → 16 * 10 = 160 SNN inputs
  popsan_obs_low: -4.0
  popsan_obs_high: 4.0
  popsan_sigma_scale: 1.0

spike_reg:
  lambda_spike: 0.001

sticky_action:
  train: false
  eval: true

benchmark:
  measure_inference_energy: false
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

post_eval:
  n_eval_steps: 512
  n_eval_episodes: null
  deterministic: true
  max_episode_steps: 50

reporting:
  save_plots: true
  wandb:
    use: false
    project: "fetchreach-snn-project"
    tags: ["research", "snn", "popsan", "population-coding"]
