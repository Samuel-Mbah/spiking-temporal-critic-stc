# Research-grade SNN Actor + ANN Critic for FetchReach
run_name: "SNN_Actor_ANN_Critic_FetchReach_v1"
project_name: "fetchreach-snn-project"
log_dir: "results/logs/fetchreach_snn_actor_ann_critic"
plots_dir: "results/plots/fetchreach_snn_actor_ann_critic"
video_dir: "results/videos/fetchreach_snn_actor_ann_critic"
wandb_dir: "results/wandb/fetchreach_snn_actor_ann_critic"

save_ckpt: true
device: "cuda"
env_seed: 42
instrument_timing: true
timing_log_interval: 100

experiment_meta:
  repeats: 1                   
  base_seed: 42
  per_repeat_tag: "research"

env:
  id: "FetchReachDense-v4"
  kwargs: {}
  n_envs: 8
  vec_normalize: true          # CRITICAL: True for continuous robotics states
  max_episode_steps: 50        # FetchReach default horizon is 50 steps
  frame_stack: 1               # Fully observable Markovian state, no memory needed
  frame_stack_flatten: true    # Flatten stacked frames for MLP/SNN input

logging:
  checkpoint_interval_updates: 10  
  save_last_checkpoint: true
  activations_probe_interval: 100
  latency_probe_interval: 100

# TRAINING
training:
  rollout_length: 2048         # Increased: Standard for continuous control
  total_updates: 500           # Increased: More updates needed to solve a robotic arm
  batch_size: 256              # Increased for stability
  update_epochs: 10            # Standard for PPO in continuous control
  sticky_action: false
  no_action_cfg: null

ppo:
  lr: 0.0005                   # Lower policy LR for stability
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.08               # Tighter PPO clipping
  clip_range_vf: 0.1
  entropy_coef: 0.0            # Set to 0.0 for continuous action spaces
  value_coef: 0.5 
  max_grad_norm: 0.5
  target_kl: 0.015  
  kl_coef: 0.02
  print_interval_updates: 10
  eval_interval_updates: 10    
  eval_episodes: 20           
  solved_window_eval_episodes: 100
  reward_threshold: -1.5       # Dense FetchReach reward is negative distance (-1.5 is solved)
  success_rate_threshold: 95.0
  scale_returns_to_value: false
  normalize_value_targets: true

model:
  mode: "snn_actor_ann_critic"
  hidden_dim: 64
  dropout: 0.0
  in_features: 16              # 16 (flattened obs) * 1 (frame stack)
  critic_informs_actor: false

# SNN CONFIGURATION
snn:
  T: 16                        # Bumped to 16 to match the actor_T of your successful run
  beta: 0.95
  V_th: 0.6                    # Bumped down to 0.6 to match actor_V_th of successful run
  poisson_encode: false
  rate_scale: 1.0
  actor_surrogate_slope: 5.0   # Matches successful run
  actor_logit_temp: 1.0
  center_logits: true

spike_reg:
  lambda_spike: 0.001

sticky_action:
  train: false
  eval: true

benchmark:
  measure_inference_energy: false
  energy_runs_per_measure: 5
  run_for_ann: false
  num_episodes_for_benchmark: 50

seed_control:
  deterministic_torch: true
  cudnn_benchmark: false

post_eval:
  n_eval_steps: 512
  n_eval_episodes: null
  deterministic: true
  max_episode_steps: 50        # Align with FetchReach max episode steps

reporting:
  save_plots: true
  wandb:
    use: false
    project: "fetchreach-snn-project"
    tags: ["research", "snn", "actor-only", "poc"]
